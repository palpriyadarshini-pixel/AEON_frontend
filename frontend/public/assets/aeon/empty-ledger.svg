<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" width="640" height="480">
  <!-- Empty Ledger State: An empty ledger rail with faint tick marks -->
  <rect width="640" height="480" fill="#181818" rx="16" />
  <rect x="0.5" y="0.5" width="639" height="479" rx="15.5" stroke="rgba(255,255,255,0.06)" />
  
  <!-- Horizontal Primary Ledger Rails -->
  <line x1="140" y1="210" x2="500" y2="210" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <line x1="140" y1="270" x2="500" y2="270" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Subtle cross connection ribs -->
  <line x1="180" y1="210" x2="180" y2="270" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="250" y1="210" x2="250" y2="270" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="320" y1="205" x2="320" y2="275" stroke="#00F0FF" stroke-width="1.5" opacity="0.6" />
  <line x1="390" y1="210" x2="390" y2="270" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="460" y1="210" x2="460" y2="270" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  
  <!-- Calibration Ticks along rail -->
  <g stroke="#55585D" stroke-width="1">
    <line x1="160" y1="207" x2="160" y2="213" />
    <line x1="200" y1="207" x2="200" y2="213" />
    <line x1="220" y1="207" x2="220" y2="213" />
    <line x1="280" y1="207" x2="280" y2="213" />
    <line x1="300" y1="207" x2="300" y2="213" />
    <line x1="340" y1="207" x2="340" y2="213" />
    <line x1="360" y1="207" x2="360" y2="213" />
    <line x1="420" y1="207" x2="420" y2="213" />
    <line x1="440" y1="207" x2="440" y2="213" />
    <line x1="480" y1="207" x2="480" y2="213" />
  </g>
  
  <!-- Central Index Reticle -->
  <circle cx="320" cy="240" r="12" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" />
  <circle cx="320" cy="240" r="3" fill="#9EA1A5" />
  
  <text x="320" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="0.12em" fill="#777777">IMMUTABLE LEDGER · NO RECORDED ENTRIES</text>
</svg>