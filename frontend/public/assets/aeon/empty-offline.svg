<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" width="640" height="480">
  <!-- Empty Offline State: A severed line between two nodes, amber end-caps -->
  <rect width="640" height="480" fill="#181818" rx="16" />
  <rect x="0.5" y="0.5" width="639" height="479" rx="15.5" stroke="rgba(255,255,255,0.06)" />
  
  <!-- Left Node and Inbound Line -->
  <circle cx="210" cy="240" r="14" fill="rgba(245,185,66,0.08)" stroke="#55585D" stroke-width="1.5" />
  <circle cx="210" cy="240" r="4" fill="#9EA1A5" />
  <line x1="140" y1="240" x2="196" y2="240" stroke="#55585D" stroke-width="1.5" />
  
  <!-- Severed Left Segment with Amber Terminal End-Cap -->
  <line x1="224" y1="240" x2="280" y2="240" stroke="#F5B942" stroke-width="2" />
  <rect x="278" y="234" width="4" height="12" rx="1" fill="#F5B942" />
  
  <!-- Severed Gap Spark Indication -->
  <line x1="298" y1="230" x2="306" y2="250" stroke="#F5B942" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <line x1="334" y1="230" x2="342" y2="250" stroke="#F5B942" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  
  <!-- Severed Right Segment with Amber Terminal End-Cap -->
  <rect x="358" y="234" width="4" height="12" rx="1" fill="#F5B942" />
  <line x1="362" y1="240" x2="416" y2="240" stroke="#F5B942" stroke-width="2" />
  
  <!-- Right Node and Outbound Line -->
  <circle cx="430" cy="240" r="14" fill="rgba(245,185,66,0.08)" stroke="#55585D" stroke-width="1.5" />
  <circle cx="430" cy="240" r="4" fill="#9EA1A5" />
  <line x1="444" y1="240" x2="500" y2="240" stroke="#55585D" stroke-width="1.5" />
  
  <text x="320" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="0.12em" fill="#F5B942">SERVICE UNREACHABLE · RECONNECTING TELEMETRY</text>
</svg>