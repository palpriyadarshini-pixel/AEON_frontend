<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="512" height="512">
  <!-- AEON Monogram Mark - Monochrome Edition -->
  <!-- Subtle backplate anchor -->
  <rect width="512" height="512" rx="104" fill="#121212" />
  <rect x="1" y="1" width="510" height="510" rx="103" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Outer Gate Structure: Precision Apex Frame -->
  <path d="M128 400 L232 120 C238 104 250 96 256 96 C262 96 274 104 280 120 L384 400" 
