<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" width="640" height="480">
  <!-- Empty Approvals State: A single quiet gate, open, one emerald point -->
  <rect width="640" height="480" fill="#181818" rx="16" />
  <rect x="0.5" y="0.5" width="639" height="479" rx="15.5" stroke="rgba(255,255,255,0.06)" />
  
  <!-- Subtle coordinate grid guides -->
  <line x1="160" y1="240" x2="480" y2="240" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 6" />
  <line x1="320" y1="120" x2="320" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4 6" />
  
  <!-- Left Gate Pillar -->
  <path d="M250 160 L250 320 M230 180 L250 160 L250 320 L230 300" stroke="#55585D" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Right Gate Pillar (Open / Cleared) -->
  <path d="M390 160 L390 320 M410 180 L390 160 L390 320 L410 300" stroke="#55585D" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Threshold baseline with calibration ticks -->
  <line x1="220" y1="320" x2="420" y2="320" stroke="#333338" stroke-width="1.5" />
  <line x1="270" y1="316" x2="270" y2="324" stroke="#55585D" stroke-width="1" />
  <line x1="320" y1="314" x2="320" y2="326" stroke="#9EA1A5" stroke-width="1.5" />
  <line x1="370" y1="316" x2="370" y2="324" stroke="#55585D" stroke-width="1" />
  
  <!-- Open Portal Beam -->
  <line x1="250" y1="240" x2="390" y2="240" stroke="rgba(29,185,84,0.15)" stroke-width="1" stroke-dasharray="6 4" />
  
  <!-- Single Emerald Node (All Authorizations Cleared) -->
  <circle cx="320" cy="240" r="16" fill="rgba(29,185,84,0.08)" />
  <circle cx="320" cy="240" r="7" fill="#1DB954" />
  <circle cx="320" cy="240" r="2" fill="#FFFFFF" />
  
  <!-- Micro Text Indicator -->
  <text x="320" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="0.12em" fill="#777777">QUEUE RECONCILED · ZERO PENDING APPROVALS</text>
</svg>