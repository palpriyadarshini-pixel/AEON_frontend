<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="512" height="512">
  <defs>
    <linearGradient id="beamGrad" x1="256" y1="64" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#1657AD" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- AEON Monogram Mark - Electric Cyan Accent Edition -->
  <rect width="512" height="512" rx="104" fill="#121212" />
  <rect x="1" y="1" width="510" height="510" rx="103" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Outer Gate Structure: High-strength titanium white -->
  <path d="M128 400 L232 120 C238 104 250 96 256 96 C262 96 274 104 280 120 L384 400" 
        stroke="#EBEBEB" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Horizontal Governance Threshold Bar -->
  <path d="M174 290 L338 290" 
        stroke="#EBEBEB" stroke-width="18" stroke-linecap="round" />
        
  <!-- Laser Authorization Beam in Electric Cyan -->
  <line x1="256" y1="64" x2="256" y2="432" 
        stroke="url(#beamGrad)" stroke-width="12" stroke-linecap="round" filter="url(#cyanGlow)" />
        
  <!-- Core Verification Diamond -->
  <polygon points="256,180 274,204 256,228 238,204" 
           fill="#00F0FF" />
</svg>